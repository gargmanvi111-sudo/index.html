<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGX Sustain Invest | Eco-Robot</title>
    <style>
        :root { --sgx: #006837; --accent: #c9a050; --glass: rgba(255, 255, 255, 0.9); }
        body { 
            background: linear-gradient(135deg, #121212 0%, #002b18 100%); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; font-family: 'Inter', -apple-system, sans-serif; 
        }
        
        #phone { 
            width: 380px; height: 800px; background: #fdfdfd; 
            border-radius: 45px; border: 12px solid #222; 
            display: flex; flex-direction: column; overflow: hidden; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
        }
        
        #header { background: var(--sgx); color: white; padding: 45px 20px 20px; text-align: center; position: relative; }
        #header h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 1px; }
        #header span { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }

        #chat-area { flex: 1; padding: 20px; overflow-y: auto; background: #f0f4f2; display: flex; flex-direction: column; gap: 12px; }
        
        .bubble { padding: 14px 18px; border-radius: 22px; font-size: 13.5px; max-width: 85%; line-height: 1.5; animation: pop 0.3s ease; }
        .bot { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .user { background: var(--sgx); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

        .stock-card { 
            background: white; border-radius: 16px; padding: 15px; margin-top: 10px;
            border-left: 6px solid var(--accent); box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .perf-pill { background: #e8f5e9; color: #2e7d32; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        
        /* Interaction Chips */
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chip { 
            background: white; color: var(--sgx); border: 1.5px solid var(--sgx); 
            padding: 8px 14px; border-radius: 25px; font-size: 11px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .chip:hover { background: var(--sgx); color: white; }

        #panel { padding: 25px; background: white; border-top: 1px solid #eee; border-radius: 30px 30px 0 0; }
        .slider-box { margin-bottom: 15px; }
        .slider-box label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #555; margin-bottom: 6px; }
        input[type=range] { width: 100%; height: 6px; accent-color: var(--sgx); cursor: pointer; }
        
        .go-btn { 
            width: 100%; background: var(--sgx); color: white; border: none; 
            padding: 16px; border-radius: 15px; font-weight: bold; font-size: 15px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,104,55,0.3);
        }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } }
    </style>
</head>
<body>

<div id="phone">
    <div id="header">
        <span>SGX Sustain Invest Layer</span>
        <h2>Eco-Robot Advisor</h2>
    </div>

    <div id="chat-area" id="chat">
        <div class="bubble bot">Welcome! I'm your <b>Eco-Robot</b>. 🤖<br><br>Set your 4 strategic priorities below. I'll search <b>ESGenome</b> for your best SGX matches.</div>
    </div>

    <div id="panel">
        <div class="slider-box">
            <label>Environmental <span>CO2 Focus</span></label>
            <input type="range" id="e" value="80">
        </div>
        <div class="slider-box">
            <label>Social <span>Labor/Diversity</span></label>
            <input type="range" id="s" value="50">
        </div>
        <div class="slider-box">
            <label>Governance <span>Ethics</span></label>
            <input type="range" id="g" value="50">
        </div>
        <div class="slider-box">
            <label>Yield <span>Returns</span></label>
            <input type="range" id="y" value="30">
        </div>
        <button class="go-btn" onclick="processESG()">Generate Portfolio</button>
    </div>
</div>

<script>
    const data = {
        env: { name: "Sembcorp Industries", code: "U96", return: "12.4%", history: "+24.1% (1yr)", impact: "High Carbon Pivot", note: "Leading SGX in renewable capacity growth." },
        gov: { name: "DBS Group", code: "D05", return: "9.2%", history: "+15.3% (1yr)", impact: "Governance Leader", note: "Top-tier ESG disclosure & transparency." },
        yld: { name: "CapitaLand Ascas REIT", code: "A17U", return: "8.5%", history: "Stable Yield", impact: "Eco-certified Assets", note: "High dividend yield from green buildings." }
    };

    function addMsg(text, sender) {
        const chat = document.getElementById('chat-area');
        const div = document.createElement('div');
        div.className = 'bubble ' + sender;
        div.innerHTML = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function processESG() {
        const e = document.getElementById('e').value;
        addMsg(`My ESG Balance: E:${e}% S:${document.getElementById('s').value}% G:${document.getElementById('g').value}% Y:${document.getElementById('y').value}%`, 'user');

        setTimeout(() => {
            let pick = (e > 60) ? data.env : (document.getElementById('y').value > 60 ? data.yld : data.gov);
            let response = `
                <b>Strategy Recommendation:</b><br>
                <div class="stock-card">
                    <span style="font-size:16px; font-weight:bold;">${pick.name} (${pick.code})</span><br>
                    <span class="perf-pill">Return: ${pick.return}</span> <span class="perf-pill" style="background:#e3f2fd; color:#1565c0;">${pick.history}</span>
                    <p style="font-size:11px; margin:10px 0;"><b>ESG Note:</b> ${pick.note}</p>
                </div>
                <div class="chip-container">
                    <div class="chip" onclick="ask('How to buy fractional?')">How to buy fractional?</div>
                    <div class="chip" onclick="ask('Risk vs Performance')">Risk vs Performance</div>
                    <div class="chip" onclick="ask('View Carbon Impact')">View Carbon Impact</div>
                </div>
            `;
            addMsg(response, 'bot');
        }, 800);
    }

    function ask(q) {
        addMsg(q, 'user');
        setTimeout(() => {
            let ans = "";
            if(q.includes('fractional')) ans = "Under our <b>Enablement</b> pillar, you can invest in this stock starting from just <b>$10</b> via the SGX Sustain Invest layer.";
            else if(q.includes('Risk')) ans = "Myth-busting time! High ESG stocks like this have shown 12.6% avg returns vs 8.6% for traditional peers, with lower downside risk.";
            else ans = "This portfolio reduces your personal carbon footprint by <b>15.4kg CO2/year</b> compared to standard market benchmarks.";
            addMsg(ans, 'bot');
        }, 600);
    }
</script>

</body>
</html>
