<!DOCTYPE html>
<html>
<head>
    <style>
        /* This section makes the background dark so the phone stands out */
        body { 
            background-color: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif;
        }

        /* This is the white phone container */
        #phone {
            width: 350px;
            height: 650px;
            background: white;
            border: 8px solid #333;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* The Green Header from your Strategy */
        .header {
            background-color: #006837;
            color: white;
            padding: 30px 10px 15px;
            text-align: center;
        }

        /* The Chat Area */
        #chat {
            flex: 1;
            background-color: #f4f4f4;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 13px;
            max-width: 80%;
        }

        .bot { background: white; align-self: flex-start; border: 1px solid #ddd; }
        .user { background: #006837; color: white; align-self: flex-end; }

        /* The Control Panel */
        .controls {
            padding: 20px;
            border-top: 1px solid #ddd;
        }

        input[type=range] { width: 100%; accent-color: #006837; }
        
        button {
            width: 100%;
            background: #006837;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="phone">
    <div class="header">
        <div style="font-size: 10px; opacity: 0.7;">SGX SUSTAIN INVEST</div>
        <div style="font-weight: bold; font-size: 18px;">Eco-Robot Advisor</div>
    </div>

    <div id="chat">
        <div class="bubble bot">Hello! I'm <b>Eco-Robot</b>. 🤖<br><br>Adjust the sliders to set your ESG priorities and I'll find your SGX matches!</div>
    </div>

    <div class="controls">
        <label style="font-size: 11px; font-weight: bold;">Environmental Priority</label>
        <input type="range" id="env" value="50">
        
        <label style="font-size: 11px; font-weight: bold; display: block; margin-top: 10px;">Yield/Return Focus</label>
        <input type="range" id="yield" value="50">
        
        <button onclick="getAdvice()">Generate Strategy</button>
    </div>
</div>

<script>
    function getAdvice() {
        const chat = document.getElementById('chat');
        const env = document.getElementById('env').value;
        
        // User Message
        let u = document.createElement('div');
        u.className = 'bubble user';
        u.innerText = "Check my " + env + "% Env focus.";
        chat.appendChild(u);

        // Bot Response
        setTimeout(() => {
            let b = document.createElement('div');
            b.className = 'bubble bot';
            
            // Strategic Logic
            if(env > 60) {
                b.innerHTML = "<b>Match: Sembcorp (U96)</b><br>Yield: +12.4%<br><i>Rationale: Leader in energy transition.</i>";
            } else {
                b.innerHTML = "<b>Match: DBS (D05)</b><br>Yield: +9.2%<br><i>Rationale: High transparency & Governance.</i>";
            }
            
            chat.appendChild(b);
            chat.scrollTop = chat.scrollHeight;
        }, 500);
    }
</script>

</body>
</html>
